[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-click-counter"
version = "0.1.0"
description = "Count dose-pen clicks in an audio recording"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
click-counter = "click_counter.cli:main"

[tool.setuptools.packages.find]
include = ["click_counter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
